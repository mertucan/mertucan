name: Profile README

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 1 * *"

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Update profile SVGs
        env:
          USER_NAME: mertucan
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN || github.token }}
        run: python profile_stats.py

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Update profile stats"
          file_pattern: "dark_mode.svg light_mode.svg"
